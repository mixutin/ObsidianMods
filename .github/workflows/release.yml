name: Build Obsidian Mods Manager

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $version = $match.Matches[0].Groups[1].Value
          & "$env:ProgramFiles(x86)\NSIS\makensis.exe" "/DAPP_VERSION=$version" assets/windows-installer.nsi
      - name: Package portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/ObsidianModsManager.exe dist/ObsidianModsManager.exe
          Compress-Archive -Path dist/* -DestinationPath ObsidianModsManager-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            ObsidianModsManager-Windows-x64.zip
            ObsidianModsManager-Setup.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev ruby ruby-dev rpm libfuse2
      - name: Build
        run: cargo build --release
      - name: Prepare package root
        run: |
          mkdir -p pkg/usr/bin pkg/usr/share/applications pkg/usr/share/icons/hicolor/scalable/apps
          cp target/release/ObsidianModsManager pkg/usr/bin/obsidian-mods-manager
          cp assets/obsidian-mods-manager.desktop pkg/usr/share/applications/
          cp assets/obsidian-mods-manager.svg pkg/usr/share/icons/hicolor/scalable/apps/
          tar -czf ObsidianModsManager-Linux-x64.tar.gz -C target/release ObsidianModsManager
      - name: Build deb and rpm
        run: |
          sudo gem install fpm --no-document
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          fpm -s dir -t deb -n obsidian-mods-manager -v "$VERSION" -p ObsidianModsManager-Linux-x64.deb --description "Obsidian Mods Manager for Minecraft Dungeons II" -C pkg .
          fpm -s dir -t rpm -n obsidian-mods-manager -v "$VERSION" -p ObsidianModsManager-Linux-x64.rpm --description "Obsidian Mods Manager for Minecraft Dungeons II" -C pkg .
      - name: Build AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --executable target/release/ObsidianModsManager --desktop-file assets/obsidian-mods-manager.desktop --icon-file assets/obsidian-mods-manager.svg --output appimage
          mv Obsidian_Mods_Manager*.AppImage ObsidianModsManager-Linux-x64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            ObsidianModsManager-Linux-x64.tar.gz
            ObsidianModsManager-Linux-x64.deb
            ObsidianModsManager-Linux-x64.rpm
            ObsidianModsManager-Linux-x64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* --repo "${GITHUB_REPOSITORY}" --generate-notes
